<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pixel Aquarium Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 🧱 픽셀 박스 */
.box {
  width: 480px;
  height: 300px;
  padding: 14px;
  background:
    linear-gradient(135deg,
      #ffd6e8,
      #fff2b8,
      #d7ecff,
      #eadcff);
  box-shadow:
    inset 0 0 0 6px #ffffff,
    inset 0 0 0 12px rgba(255,255,255,0.5),
    0 12px 0 #cbbcf6;
  image-rendering: pixelated;
}

/* ☁ 픽셀 구름 */
.cloud {
  position: absolute;
  top: 6px;
  left: 24px;
  width: 48px;
  height: 16px;
  background: #ffffff;
  box-shadow:
    16px 0 #ffffff,
    32px 4px #ffffff,
    8px 8px #ffffff,
    24px 8px #ffffff;
  opacity: 0.7;
}

/* 💧 수족관 */
.aquarium {
  position: relative;
  width: 100%;
  height: 210px;
  background: linear-gradient(
    to bottom,
    #eef9ff,
    #dff3ff,
    #eafcff
  );
  overflow: hidden;
}

/* 🌊 픽셀 파도 */
.wave {
  position: absolute;
  top: 0;
  width: 100%;
  height: 16px;
  background:
    repeating-linear-gradient(
      to right,
      rgba(255,255,255,0.6) 0 8px,
      rgba(255,255,255,0) 8px 16px
    );
  animation: waveMove 6s linear infinite;
}

@keyframes waveMove {
  from { background-position-x: 0; }
  to { background-position-x: 32px; }
}

/* 🐟 픽셀 물고기 */
.fish {
  position: absolute;
  width: 16px;
  height: 8px;
  image-rendering: pixelated;
}

/* 몸통 */
.fish .body {
  width: 16px;
  height: 8px;
  background: currentColor;
}

/* 눈 */
.fish .eye {
  position: absolute;
  top: 2px;
  left: 10px;
  width: 2px;
  height: 2px;
  background: #000;
}

.fish .eye::after {
  content: "";
  position: absolute;
  left: -1px;
  width: 1px;
  height: 1px;
  background: #fff;
}

/* 꼬리 */
.fish .tail {
  position: absolute;
  left: -4px;
  top: 2px;
  width: 4px;
  height: 4px;
  background: currentColor;
}

/* ✨ 픽셀 입자 */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255,255,255,0.9);
  animation: float 5s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 0; }
  40% { opacity: 1; }
  100% { transform: translateY(-160px); opacity: 0; }
}

/* 📝 텍스트 */
.label {
  margin-top: 8px;
  text-align: center;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  color: #6b5c88;
}
</style>
</head>

<body>

<div class="box">
  <div class="cloud"></div>

  <div class="aquarium" id="aquarium">
    <div class="wave"></div>
  </div>

  <div class="label">Welcome My Notion Home</div>
</div>

<script>
const aquarium = document.getElementById("aquarium");
const colors = ["#ffb3d9","#ffd6a5","#cdb4ff","#bde0fe","#caffbf","#ffc8dd"];

class Fish {
  constructor() {
    this.el = document.createElement("div");
    this.el.className = "fish";
    this.el.style.color = colors[Math.floor(Math.random()*colors.length)];

    this.body = document.createElement("div");
    this.body.className = "body";
    this.eye = document.createElement("div");
    this.eye.className = "eye";
    this.tail = document.createElement("div");
    this.tail.className = "tail";

    this.el.append(this.body, this.eye, this.tail);

    this.x = Math.random() * 440;
    this.y = Math.random() * 180;
    this.speed = 0.15 + Math.random() * 0.25;

    this.setTarget();
    aquarium.appendChild(this.el);
    this.move();
  }

  setTarget() {
    this.tx = Math.random() * 440;
    this.ty = Math.random() * 180;
  }

  move() {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 1) this.setTarget();
    else {
      this.x += dx / dist * this.speed;
      this.y += dy / dist * this.speed;
    }

    this.el.style.transform =
      `translate(${this.x}px, ${this.y}px) ${dx < 0 ? "scaleX(-1)" : ""}`;

    requestAnimationFrame(() => this.move());
  }
}

for (let i = 0; i < 7; i++) new Fish();

for (let i = 0; i < 18; i++) {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "%";
  s.style.bottom = "0";
  s.style.animationDelay = Math.random() * 5 + "s";
  aquarium.appendChild(s);
}
</script>

</body>
</html>
