<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aquarium Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 🧱 수족관 박스 */
.aquarium-box {
  width: 380px;
  height: 220px;
  padding: 14px;
  box-sizing: border-box;

  background:
    linear-gradient(135deg,
      #ffd6e8,
      #fff2b8,
      #d7ecff,
      #e7d9ff);

  border-radius: 14px;

  box-shadow:
    inset 0 0 0 6px rgba(255,255,255,0.8),
    inset 0 0 0 12px rgba(255,255,255,0.4),
    0 10px 25px rgba(180,150,255,0.4);
}

/* 픽셀 느낌 */
.aquarium-box::before {
  content: "";
  position: absolute;
}

/* 💧 물 영역 */
.aquarium {
  position: relative;
  width: 100%;
  height: 160px;
  background: linear-gradient(
    to bottom,
    #eaf6ff,
    #dff1ff,
    #eafcff
  );
  border-radius: 8px;
  overflow: hidden;
}

/* 🐠 물고기 */
.fish {
  position: absolute;
  width: 60px;
  height: 30px;
  background: linear-gradient(
    135deg,
    #ffb3e6,
    #a8d8ff
  );
  border-radius: 50% 40% 40% 50%;
  animation: swim 14s linear infinite;
}

.fish::after {
  content: "";
  position: absolute;
  right: -18px;
  top: 6px;
  width: 22px;
  height: 18px;
  background: linear-gradient(
    135deg,
    #ffd6f2,
    #bcdcff
  );
  border-radius: 50%;
  transform: rotate(20deg);
  animation: tail 0.6s ease-in-out infinite;
}

@keyframes swim {
  0%   { transform: translateX(-80px); }
  100% { transform: translateX(420px); }
}

@keyframes tail {
  0% { transform: rotate(15deg); }
  50% { transform: rotate(-15deg); }
  100% { transform: rotate(15deg); }
}

/* 💭 부유물 */
.bubble {
  position: absolute;
  width: 6px;
  height: 6px;
  background: rgba(255,255,255,0.8);
  border-radius: 50%;
  animation: bubble 6s infinite ease-in;
}

@keyframes bubble {
  0% { transform: translateY(0); opacity: 0; }
  30% { opacity: 0.8; }
  100% { transform: translateY(-140px); opacity: 0; }
}

/* 📝 문구 */
.label {
  margin-top: 10px;
  text-align: center;
  font-family: 'Press Start 2P', cursive;
  font-size: 11px;
  color: #6b5c88;
}
</style>
</head>

<body>

<div class="aquarium-box">
  <div class="aquarium">

    <div class="fish" style="top:40px;"></div>

    <!-- 부유물 많이 -->
    <div class="bubble" style="left:40px; animation-delay:0s;"></div>
    <div class="bubble" style="left:90px; animation-delay:1s;"></div>
    <div class="bubble" style="left:150px; animation-delay:2s;"></div>
    <div class="bubble" style="left:220px; animation-delay:3s;"></div>
    <div class="bubble" style="left:300px; animation-delay:1.5s;"></div>
    <div class="bubble" style="left:330px; animation-delay:2.5s;"></div>

  </div>

  <div class="label">Welcome My Notion Home</div>
</div>

</body>
</html>
