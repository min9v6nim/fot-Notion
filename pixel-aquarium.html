<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pastel Aquarium Widget</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Press Start 2P', monospace;
}

/* ===== MP3 감성 박스 ===== */
.widget-box {
  width: 100%;
  height: 100%;
  min-height: 240px;
  background: linear-gradient(135deg, #f6c1e5, #d9c9ff, #bcdcff);
  border-radius: 20px;
  padding: 10px;
  box-sizing: border-box;
}

/* ===== 물 영역 ===== */
.water {
  position: relative;
  width: 100%;
  height: calc(100% - 36px);
  background: linear-gradient(
    180deg,
    #7fc8ff,
    #6bb7ff,
    #5aa6ff
  );
  border-radius: 14px;
  overflow: hidden;
  box-shadow: inset 0 0 12px rgba(255,255,255,0.4);
}

/* 물 빛 */
.water::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 25% 30%, rgba(255,255,255,0.35), transparent 40%),
    radial-gradient(circle at 75% 60%, rgba(255,255,255,0.25), transparent 45%);
  animation: waterGlow 6s ease-in-out infinite alternate;
}

@keyframes waterGlow {
  from { opacity: 0.6; }
  to { opacity: 1; }
}

/* ===== 열대어 ===== */
.fish {
  position: absolute;
  width: 32px;
  height: 16px;
  animation:
    swim linear infinite,
    float 3s ease-in-out infinite;
}

/* 몸통 */
.fish .body {
  width: 22px;
  height: 14px;
  background: currentColor;
  border-radius: 4px;
  position: absolute;
  top: 1px;
  left: 6px;
}

/* 꼬리 */
.fish .tail {
  width: 8px;
  height: 10px;
  background: currentColor;
  position: absolute;
  left: 0;
  top: 3px;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}

/* 눈 */
.fish .eye {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  right: 6px;
  top: 5px;
}

/* 움직임 */
@keyframes swim {
  from { left: -40px; }
  to { left: 100%; }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* 색상 */
.blue   { color: #7fd3ff; }
.pink   { color: #ff9fd6; }
.yellow { color: #ffe28a; }
.purple { color: #c7a7ff; }

/* ===== 기포 ===== */
.bubble {
  position: absolute;
  bottom: -10px;
  width: 6px;
  height: 6px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  animation: bubble 7s linear infinite;
}

@keyframes bubble {
  from { transform: translateY(0); opacity: 0; }
  to { transform: translateY(-220px); opacity: 1; }
}

/* ===== 하단 텍스트 ===== */
.footer {
  height: 26px;
  text-align: center;
  font-size: 10px;
  color: #6b5b95;
  line-height: 26px;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
}
</style>
</head>

<body>
<div class="widget-box">
  <div class="water">

    <!-- 물고기 -->
    <div class="fish blue" style="top:30%; animation-duration:14s;">
      <div class="tail"></div><div class="body"></div><div class="eye"></div>
    </div>

    <div class="fish pink" style="top:50%; animation-duration:18s;">
      <div class="tail"></div><div class="body"></div><div class="eye"></div>
    </div>

    <div class="fish yellow" style="top:65%; animation-duration:16s;">
      <div class="tail"></div><div class="body"></div><div class="eye"></div>
    </div>

    <div class="fish purple" style="top:40%; animation-duration:20s;">
      <div class="tail"></div><div class="body"></div><div class="eye"></div>
    </div>

    <!-- 기포 -->
    <div class="bubble" style="left:25%;"></div>
    <div class="bubble" style="left:50%; animation-duration:6s;"></div>
    <div class="bubble" style="left:70%; animation-duration:8s;"></div>

  </div>

  <div class="footer">My Notion Home</div>
</div>
</body>
</html>
