<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pixel Aquarium Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 🧱 박스 */
.box {
  width: 460px;
  height: 280px;
  padding: 16px;
  box-sizing: border-box;
  background: linear-gradient(
    135deg,
    #ffd6e8,
    #fff2b8,
    #d7ecff,
    #eadcff
  );
  border-radius: 16px;
  box-shadow:
    inset 0 0 0 6px rgba(255,255,255,0.9),
    inset 0 0 0 14px rgba(255,255,255,0.45),
    0 14px 30px rgba(180,150,255,0.45);
}

/* 💧 수족관 */
.aquarium {
  position: relative;
  width: 100%;
  height: 200px;
  background: linear-gradient(
    to bottom,
    #eef9ff,
    #dff3ff,
    #eafcff
  );
  border-radius: 10px;
  overflow: hidden;
}

/* 🌊 물결 */
.aquarium::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      120deg,
      rgba(255,255,255,0.08) 0px,
      rgba(255,255,255,0.08) 4px,
      rgba(255,255,255,0) 8px
    );
  animation: wave 6s linear infinite;
}

@keyframes wave {
  from { background-position: 0 0; }
  to { background-position: 120px 60px; }
}

/* 🐟 픽셀 물고기 */
.fish {
  position: absolute;
  width: 16px;
  height: 8px;
  image-rendering: pixelated;
}

/* 픽셀 물고기 모양 */
.fish::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(currentColor 0 0);
  box-shadow:
    0 0 currentColor,
    4px 0 currentColor,
    8px 0 currentColor,
    0 4px currentColor,
    4px 4px currentColor,
    8px 4px currentColor,
    -4px 4px currentColor,
    12px 4px currentColor;
}

/* 꼬리 */
.fish::after {
  content: "";
  position: absolute;
  left: -4px;
  top: 2px;
  width: 4px;
  height: 4px;
  background: currentColor;
}

/* ✨ 픽셀 반짝이 */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255,255,255,0.9);
  animation: float 4s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 0; }
  40% { opacity: 1; }
  100% { transform: translateY(-160px); opacity: 0; }
}

/* 📝 문구 */
.label {
  margin-top: 10px;
  text-align: center;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  color: #6b5c88;
}
</style>
</head>

<body>

<div class="box">
  <div class="aquarium" id="aquarium"></div>
  <div class="label">Welcome My Notion Home</div>
</div>

<script>
const aquarium = document.getElementById("aquarium");

const pastelColors = [
  "#ffb3d9",
  "#ffd6a5",
  "#cdb4ff",
  "#bde0fe",
  "#caffbf",
  "#ffc8dd"
];

class Fish {
  constructor() {
    this.el = document.createElement("div");
    this.el.className = "fish";
    this.el.style.color =
      pastelColors[Math.floor(Math.random() * pastelColors.length)];

    this.x = Math.random() * 420;
    this.y = Math.random() * 180;
    this.speed = 0.3 + Math.random() * 0.6;

    this.setTarget();
    aquarium.appendChild(this.el);
    this.move();
  }

  setTarget() {
    this.tx = Math.random() * 420;
    this.ty = Math.random() * 180;
  }

  move() {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 2) this.setTarget();
    else {
      this.x += dx / dist * this.speed;
      this.y += dy / dist * this.speed;
    }

    this.el.style.transform =
      `translate(${this.x}px, ${this.y}px) ${dx < 0 ? "scaleX(-1)" : ""}`;

    requestAnimationFrame(() => this.move());
  }
}

// 물고기 여러 마리 (각자 따로)
for (let i = 0; i < 8; i++) new Fish();

// 반짝이
for (let i = 0; i < 16; i++) {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "%";
  s.style.bottom = "0";
  s.style.animationDelay = Math.random() * 4 + "s";
  aquarium.appendChild(s);
}
</script>

</body>
</html>
