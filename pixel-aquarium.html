<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pixel Aquarium Widget</title>

<!-- 픽셀 느낌 폰트 -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: 'Press Start 2P', monospace;
}

/* 전체 수족관 */
.aquarium {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 220px;
  background: linear-gradient(
    180deg,
    #b8d8ff,
    #d7c8ff,
    #f6c1e5,
    #fff0b3
  );
  border-radius: 16px;
  overflow: hidden;
}

/* 몽글한 빛 효과 */
.aquarium::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(255,255,255,0.2), transparent 45%);
  animation: glow 6s ease-in-out infinite alternate;
}

@keyframes glow {
  from { opacity: 0.6; }
  to { opacity: 1; }
}

/* 물고기 */
.fish {
  position: absolute;
  width: 22px;
  height: 14px;
  image-rendering: pixelated;
  animation:
    swim linear infinite,
    float 3s ease-in-out infinite;
}

@keyframes swim {
  from { transform: translateX(-30px); }
  to { transform: translateX(calc(100vw + 30px)); }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* 픽셀 물고기 모양 */
.fish::before {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(
      to right,
      currentColor 70%,
      transparent 70%
    );
}

/* 색상 변형 */
.fish.blue { color: #7fc8ff; }
.fish.purple { color: #c7a7ff; }
.fish.pink { color: #ffb7da; }
.fish.yellow { color: #ffe28a; }

/* 하단 텍스트 */
.footer {
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
  font-size: 10px;
  color: #6b5b95;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  pointer-events: none;
}
</style>
</head>

<body>
<div class="aquarium">
  <div class="fish blue" style="top:30%; animation-duration: 18s;"></div>
  <div class="fish purple" style="top:45%; animation-duration: 22s;"></div>
  <div class="fish pink" style="top:60%; animation-duration: 20s;"></div>
  <div class="fish yellow" style="top:38%; animation-duration: 26s;"></div>

  <div class="footer">My Notion Home</div>
</div>
</body>
</html>
