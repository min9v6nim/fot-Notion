<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pixel Aquarium Widget</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Press Start 2P', monospace;
}

/* ===== 수족관 ===== */
.aquarium {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 220px;
  background: linear-gradient(
    180deg,
    #bcdcff,
    #d9c9ff,
    #f6c1e5,
    #fff1b8
  );
  border-radius: 16px;
  overflow: hidden;
}

/* 몽글몽글 빛 */
.aquarium::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(255,255,255,0.25), transparent 45%);
  animation: glow 6s ease-in-out infinite alternate;
}

@keyframes glow {
  from { opacity: 0.6; }
  to { opacity: 1; }
}

/* ===== 물고기 ===== */
.fish {
  position: absolute;
  width: 24px;
  height: 14px;
  background: currentColor;
  border-radius: 3px;
  image-rendering: pixelated;
  animation:
    swim linear infinite,
    float 3s ease-in-out infinite;
}

/* 꼬리 */
.fish::after {
  content: "";
  position: absolute;
  right: -6px;
  top: 4px;
  width: 6px;
  height: 6px;
  background: currentColor;
}

/* 좌 → 우 이동 (iframe 안전) */
@keyframes swim {
  from { left: -30px; }
  to { left: 100%; }
}

/* 둥실둥실 */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* 색상 */
.fish.blue   { color: #7fc8ff; }
.fish.purple{ color: #c7a7ff; }
.fish.pink  { color: #ffb7da; }
.fish.yellow{ color: #ffe28a; }

/* ===== 기포 ===== */
.bubble {
  position: absolute;
  bottom: -10px;
  width: 6px;
  height: 6px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  animation: bubble 6s linear infinite;
}

@keyframes bubble {
  from { transform: translateY(0); opacity: 0; }
  to { transform: translateY(-260px); opacity: 1; }
}

/* ===== 하단 문구 ===== */
.footer {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 10px;
  color: #6b5b95;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  pointer-events: none;
}
</style>
</head>

<body>
<div class="aquarium">

  <!-- 물고기 -->
  <div class="fish blue" style="top:30%; animation-duration:14s;"></div>
  <div class="fish purple" style="top:45%; animation-duration:18s;"></div>
  <div class="fish pink" style="top:60%; animation-duration:16s;"></div>
  <div class="fish yellow" style="top:38%; animation-duration:20s;"></div>

  <!-- 기포 -->
  <div class="bubble" style="left:20%; animation-duration:7s;"></div>
  <div class="bubble" style="left:40%; animation-duration:6s;"></div>
  <div class="bubble" style="left:60%; animation-duration:8s;"></div>
  <div class="bubble" style="left:75%; animation-duration:7.5s;"></div>

  <!-- 문구 -->
  <div class="footer">My Notion Home</div>

</div>
</body>
</html>
