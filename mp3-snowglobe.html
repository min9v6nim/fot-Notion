<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Notion Snowglobe</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>

<style>
:root{
  --grad1:#ffd6e8;
  --grad2:#fff2c9;
  --grad3:#dff1ff;
  --grad4:#e6ddff;
  --ink:#2b2b2b;
}

html,body{
  margin:0;
  height:100%;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
}

.mp3Widget{
  width:360px;
  padding:14px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--grad1),var(--grad2),var(--grad3),var(--grad4));
  box-shadow:
    0 18px 40px rgba(0,0,0,.12),
    inset 0 0 0 4px rgba(255,255,255,.45);
  font-family:"Press Start 2P", system-ui, sans-serif;
  color:var(--ink);
}

.pixelFrame{
  border-radius:14px;
  padding:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.25));
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.6),
    inset 0 -6px 0 rgba(0,0,0,.04);
}

.topBar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 6px 10px;
}

.led{
  width:9px;height:9px;
  background:#bfffe2;
  border-radius:3px;
  box-shadow:
    0 0 0 2px rgba(255,255,255,.4),
    0 0 14px rgba(191,255,226,.9);
}

.title{
  font-size:9px;
  letter-spacing:1px;
  opacity:.75;
}

.screen{
  background:#eaf5ff;
  border-radius:12px;
  padding:10px;
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.55),
    inset 0 -8px 0 rgba(0,0,0,.04);
}

canvas{
  width:100%;
  display:block;
  image-rendering:pixelated;
  border-radius:8px;
}

.controls{
  display:flex;
  gap:8px;
  padding:12px 6px 4px;
}

.btn{
  flex:1;
  text-align:center;
  padding:8px 0;
  font-size:10px;
  background:rgba(255,255,255,.35);
  border-radius:10px;
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.45),
    inset 0 -5px 0 rgba(0,0,0,.05);
  cursor:pointer;
}

.btn.play{
  background:rgba(255,255,255,.55);
}

.brand{
  margin-top:10px;
  padding:10px 6px;
  text-align:center;
  font-size:10px;
  letter-spacing:1.5px;
  background:rgba(255,255,255,.3);
  border-radius:12px;
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.35),
    inset 0 -6px 0 rgba(0,0,0,.05);
  opacity:.85;
}

@media (max-width:420px){
  .mp3Widget{ width:92vw; }
}
</style>
</head>

<body>
<div class="mp3Widget">
  <div class="pixelFrame">

    <div class="topBar">
      <div class="led"></div>
      <div class="title">SNOWGLOBE</div>
    </div>

    <div class="screen">
      <canvas id="scene" width="320" height="320"></canvas>
    </div>

    <div class="controls">
      <div class="btn">◁◁</div>
      <div class="btn play">▶</div>
      <div class="btn" id="toggle">▷▷</div>
    </div>

    <div class="brand">MY NOTION HOME</div>
  </div>
</div>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;
const PX = 2;

const globe = { x:W/2, y:150, r:118 };

// 배경 이미지 (이미 업로드된 cloud.png)
const bgImg = new Image();
bgImg.src = "./cloud.png";

// 모드 상태
let MODE = "snow"; // snow | flower
document.getElementById("toggle").onclick = () => {
  MODE = MODE === "snow" ? "flower" : "snow";
};

// 파티클
class Particle{
  constructor(){ this.reset(true); }
  reset(init){
    const a = Math.random()*Math.PI*2;
    const rr = Math.sqrt(Math.random())*(globe.r-10);
    this.x = globe.x + Math.cos(a)*rr;
    this.y = init ? globe.y + Math.sin(a)*rr : globe.y - globe.r - 20;
    this.speed = 0.16 + Math.random()*0.2;
    this.drift = (Math.random()-0.5)*0.12;
    this.phase = Math.random()*Math.PI*2;
    this.alpha = 0.85;
  }
  update(){
    this.phase += 0.01;
    this.x += this.drift + Math.sin(this.phase)*0.05;
    this.y += this.speed;
    if(this.y > globe.y + globe.r + 20) this.reset(false);
  }
  draw(){
    ctx.globalAlpha = this.alpha;
    if(MODE === "snow") drawSnow(this.x,this.y);
    else drawFlower(this.x,this.y);
    ctx.globalAlpha = 1;
  }
}

// ❄️ 8px 파스텔 핑크 눈
function drawSnow(x,y){
  const size = 8;
  const X = Math.floor(x/PX)*PX;
  const Y = Math.floor(y/PX)*PX;
  ctx.fillStyle = "#ffd6e8";
  for(let i=-size/2;i<=size/2;i++){
    ctx.fillRect(X+i*PX,Y,PX,PX);
    ctx.fillRect(X,Y+i*PX,PX,PX);
  }
}

// 🌸 픽셀 꽃
function drawFlower(x,y){
  const X = Math.floor(x/PX)*PX;
  const Y = Math.floor(y/PX)*PX;
  ctx.fillStyle = "#ffcade";
  const petals = [
    [0,-2],[2,0],[0,2],[-2,0],[0,0]
  ];
  petals.forEach(p=>{
    ctx.fillRect(X+p[0]*PX,Y+p[1]*PX,4,4);
  });
}

const particles = Array.from({length:30},()=>new Particle());

function drawBackground(){
  if(bgImg.complete){
    ctx.globalAlpha=0.28;
    ctx.drawImage(bgImg,0,0,W,H);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.fillRect(0,0,W,H);
}

function drawGlobe(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(globe.x,globe.y,globe.r,0,Math.PI*2);
  ctx.clip();

  drawBackground();

  const glow = ctx.createRadialGradient(
    globe.x,globe.y-80,20,
    globe.x,globe.y,globe.r
  );
  glow.addColorStop(0,"rgba(255,245,220,.55)");
  glow.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  particles.forEach(p=>{
    p.update();
    p.draw();
  });

  ctx.restore();

  ctx.strokeStyle="rgba(255,255,255,.35)";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.arc(globe.x,globe.y,globe.r,0,Math.PI*2);
  ctx.stroke();
}

(function loop(){
  ctx.clearRect(0,0,W,H);
  drawGlobe();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
