<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Calendar</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="widget">
    <header class="header">
      <div class="logo">
        <img src="dog.png" alt="dog">
      </div>

      <div class="month" id="monthTitle"></div>

      <div class="nav">
        <button id="prevBtn">◀</button>
        <button id="todayBtn">Today</button>
        <button id="nextBtn">▶</button>
      </div>
    </header>

    <div class="week">
      <span>일</span><span>월</span><span>화</span><span>수</span>
      <span>목</span><span>금</span><span>토</span>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
