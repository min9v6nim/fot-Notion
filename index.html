<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Notion Calendar</title>

  <!-- NanumSquare -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="logo">
        <img src="dog.png" alt="pixel dog">
      </div>

      <div class="title">
        <h1 id="monthTitle"></h1>
      </div>

      <div class="nav">
        <button id="prevBtn">◀</button>
        <button id="todayBtn">Today</button>
        <button id="nextBtn">▶</button>
      </div>
    </header>

    <section class="card">
      <div class="weekhead">
        <div>일SUN</div>
        <div>월MON</div>
        <div>화TUE</div>
        <div>수WED</div>
        <div>목THU</div>
        <div>금FRI</div>
        <div>토SAT</div>
      </div>

      <div id="grid" class="grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
