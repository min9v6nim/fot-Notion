<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pixel Snowball Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 전체 위젯 */
.widget {
  width: 520px;
  height: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  image-rendering: pixelated;
}

/* 🔮 스노우볼 */
.snowball {
  position: relative;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  overflow: hidden;

  background:
    radial-gradient(circle at 30% 25%,
      rgba(255,255,255,0.95),
      rgba(255,255,255,0.6) 30%,
      rgba(255,255,255,0.25) 55%,
      rgba(255,255,255,0.1)
    );

  box-shadow:
    inset 0 0 0 10px rgba(255,255,255,0.7),
    inset 0 0 30px rgba(255,255,255,0.5),
    0 30px 60px rgba(180,150,255,0.5);
}

/* 유리 하이라이트 */
.snowball::before {
  content: "";
  position: absolute;
  inset: -30px;
  background:
    radial-gradient(circle at 28% 20%,
      rgba(255,255,255,0.9),
      rgba(255,255,255,0) 40%),
    radial-gradient(circle at 70% 30%,
      rgba(255,255,255,0.4),
      rgba(255,255,255,0) 50%);
  pointer-events: none;
}

/* 내부 */
.inner {
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  background: linear-gradient(
    to bottom,
    #f5a6d6,
    #d9b9ff,
    #bcd9ff
  );
  overflow: hidden;
}

/* 바닥 눈 */
.inner::after {
  content: "";
  position: absolute;
  bottom: -10px;
  width: 100%;
  height: 70px;
  background: radial-gradient(
    circle at 50% 0%,
    rgba(255,255,255,0.95),
    rgba(255,255,255,0.7)
  );
}

/* ❄️ 픽셀 눈송이 */
.flake {
  position: absolute;
  width: 18px;
  height: 18px;
}

.flake::before {
  content: "";
  position: absolute;
  width: 3px;
  height: 3px;
  background: #fff;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  box-shadow:
    6px 0 #fff,
    -6px 0 #fff,
    0 6px #fff,
    0 -6px #fff,
    3px 3px #fff,
    -3px 3px #fff,
    3px -3px #fff,
    -3px -3px #fff;
}

/* ⛄ 픽셀 눈사람 */
.snowman {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
}

.ball {
  background: #fff;
  border: 2px solid #e8e8e8;
}

.ball.bottom {
  width: 44px;
  height: 44px;
}

.ball.top {
  width: 32px;
  height: 32px;
  margin: -6px auto 0;
  position: relative;
}

/* 얼굴 */
.eye {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #333;
  top: 10px;
}

.eye.left { left: 8px; }
.eye.right { right: 8px; }

.nose {
  position: absolute;
  width: 6px;
  height: 4px;
  background: #ff9f6e;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
}

.mouth {
  position: absolute;
  width: 10px;
  height: 2px;
  background: #555;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
}

/* 🧊 하단 픽셀 박스 */
.base {
  width: 280px;
  height: 72px;
  margin-top: -20px;
  background:
    linear-gradient(#ffd6f0, #e8bfff);
  border: 4px solid #fff;
  box-shadow:
    inset -4px -4px rgba(0,0,0,0.05),
    inset 4px 4px rgba(255,255,255,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
}

.base span {
  font-family: "Press Start 2P";
  font-size: 12px;
  color: #8a4fdc;
  text-shadow:
    2px 2px rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<div class="widget">
  <div class="snowball">
    <div class="inner" id="inner">

      <div class="snowman">
        <div class="ball bottom"></div>
        <div class="ball top">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="base">
    <span>My Notion Home</span>
  </div>
</div>

<script>
const inner = document.getElementById("inner");
const FLAKES = 32;
const flakes = [];

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

for (let i = 0; i < FLAKES; i++) {
  const f = document.createElement("div");
  f.className = "flake";
  inner.appendChild(f);

  flakes.push({
    el: f,
    x: rand(0, inner.clientWidth),
    y: rand(-inner.clientHeight, inner.clientHeight),
    vy: rand(0.5, 1),
    phase: rand(0, Math.PI * 2)
  });
}

let t = 0;
function animate() {
  t += 0.02;
  for (const f of flakes) {
    f.y += f.vy;
    f.x += Math.sin(t + f.phase) * 0.3;

    if (f.y > inner.clientHeight) {
      f.y = -10;
      f.x = rand(0, inner.clientWidth);
    }

    f.el.style.transform = `translate(${f.x}px, ${f.y}px)`;
  }
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
