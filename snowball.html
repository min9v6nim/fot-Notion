<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pastel Snowball Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 전체 위젯 */
.widget {
  width: 360px;
  height: 360px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🔮 스노우볼 */
.snowball {
  position: relative;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  overflow: hidden;

  /* 유리 외곽 */
  background:
    radial-gradient(circle at 30% 25%,
      rgba(255,255,255,0.95),
      rgba(255,255,255,0.55) 30%,
      rgba(255,255,255,0.25) 55%,
      rgba(255,255,255,0.15)
    );

  box-shadow:
    inset 0 0 0 8px rgba(255,255,255,0.65),
    inset 0 0 24px rgba(255,255,255,0.45),
    0 20px 40px rgba(180,150,255,0.45);
}

/* 유리 하이라이트 */
.snowball::before {
  content: "";
  position: absolute;
  inset: -20px;
  background:
    radial-gradient(circle at 28% 20%,
      rgba(255,255,255,0.9),
      rgba(255,255,255,0) 38%),
    radial-gradient(circle at 70% 30%,
      rgba(255,255,255,0.35),
      rgba(255,255,255,0) 45%);
  pointer-events: none;
}

/* 내부 배경 */
.inner {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: linear-gradient(
    to bottom,
    #f7c1de,
    #d8c7ff,
    #c6ddff
  );
  overflow: hidden;
}

/* 바닥 눈 */
.inner::after {
  content: "";
  position: absolute;
  bottom: -12px;
  left: 0;
  width: 100%;
  height: 60px;
  background: radial-gradient(
    circle at 50% 0%,
    rgba(255,255,255,0.95),
    rgba(255,255,255,0.75),
    rgba(255,255,255,0.55)
  );
}

/* ❄️ 픽셀 눈송이 */
.flake {
  position: absolute;
  width: 14px;
  height: 14px;
  image-rendering: pixelated;
  opacity: 0.95;
}

.flake::before {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  box-shadow:
    4px 0 #fff,
    -4px 0 #fff,
    0 4px #fff,
    0 -4px #fff,
    2px 2px #fff,
    -2px 2px #fff,
    2px -2px #fff,
    -2px -2px #fff;
}
</style>
</head>

<body>

<div class="widget">
  <div class="snowball" id="snowball">
    <div class="inner" id="inner"></div>
  </div>
</div>

<script>
const inner = document.getElementById("inner");
const W = () => inner.clientWidth;
const H = () => inner.clientHeight;

const FLAKES = 34;
const flakes = [];

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function createFlake() {
  const el = document.createElement("div");
  el.className = "flake";
  inner.appendChild(el);

  return {
    el,
    x: rand(0, W()),
    y: rand(-H(), H()),
    vy: rand(0.4, 0.9),
    vx: rand(-0.25, 0.25),
    drift: rand(0.6, 1.4),
    phase: rand(0, Math.PI * 2)
  };
}

for (let i = 0; i < FLAKES; i++) flakes.push(createFlake());

let t = 0;
function animate() {
  t += 0.016;

  for (const f of flakes) {
    f.y += f.vy;
    f.x += f.vx + Math.sin(t * f.drift + f.phase) * 0.4;

    if (f.y > H()) {
      f.y = rand(-20, -5);
      f.x = rand(0, W());
    }

    f.el.style.transform =
      `translate(${f.x}px, ${f.y}px)`;
  }

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
