<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Snowglobe</title>
<style>
  body {
    margin: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  canvas {
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="c" width="360" height="420"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const globe = {
  x: W / 2,
  y: 170,
  r: 130
};

const PIXEL = 3;

const COLORS = {
  glass: "#ffffff22",
  sky: "#e6f4ff",
  snow: "#ffffff",
  glow: "#fff3d4",
  baseTop: "#f2cce0",
  baseSide: "#d6a8c4",
  text: "#ffffff"
};

class Snow {
  constructor() {
    this.reset();
  }
  reset() {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * globe.r;
    this.x = globe.x + Math.cos(a) * r;
    this.y = globe.y + Math.sin(a) * r;
    this.size = 3 + Math.random() * 3;
    this.speed = 0.15 + Math.random() * 0.25;
  }
  update() {
    this.y += this.speed;
    if (this.y > globe.y + globe.r) this.reset();
  }
  draw() {
    ctx.fillStyle = COLORS.snow;
    ctx.fillRect(
      Math.floor(this.x / PIXEL) * PIXEL,
      Math.floor(this.y / PIXEL) * PIXEL,
      this.size,
      this.size
    );
  }
}

const snowflakes = Array.from({ length: 35 }, () => new Snow());

function drawGlow() {
  const g = ctx.createRadialGradient(
    globe.x, globe.y - 80, 20,
    globe.x, globe.y, globe.r
  );
  g.addColorStop(0, COLORS.glow);
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(globe.x, globe.y, globe.r, 0, Math.PI * 2);
  ctx.fill();
}

function drawGlobe() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(globe.x, globe.y, globe.r, 0, Math.PI * 2);
  ctx.clip();

  ctx.fillStyle = COLORS.sky;
  ctx.fillRect(0, 0, W, H);

  drawGlow();

  snowflakes.forEach(s => {
    s.update();
    s.draw();
  });

  ctx.restore();

  ctx.strokeStyle = COLORS.glass;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(globe.x, globe.y, globe.r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawBase() {
  const bw = 240;
  const bh = 70;
  const bx = (W - bw) / 2;
  const by = globe.y + globe.r - 10;

  ctx.fillStyle = COLORS.baseSide;
  ctx.fillRect(bx, by, bw, bh);

  ctx.fillStyle = COLORS.baseTop;
  ctx.fillRect(bx, by, bw, 14);

  ctx.fillStyle = COLORS.text;
  ctx.font = "12px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("MY NOTION HOME", W / 2, by + bh / 2 + 6);
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  drawGlobe();
  drawBase();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
